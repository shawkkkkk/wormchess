[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wormchess"
version = "0.1.0"
description = "A playable chess interface driven by a fixed C. elegans connectome reservoir"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
play = ["chess>=1.11"]
dev = ["pytest>=8", "chess>=1.11"]

[tool.setuptools]
packages = ["wormchess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
